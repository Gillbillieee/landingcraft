<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoverEnhance — AI Cover Letter Optimizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafbfe;
      --surface-solid: #ffffff;
      --border: rgba(0,0,0,0.06);
      --text: #0f172a;
      --text-secondary: #475569;
      --primary: #ec4899;
      --gradient-primary: linear-gradient(135deg, #ec4899 0%, #f472b6 50%, #f9a8d4 100%);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(ellipse at 30% 20%, rgba(236,72,153,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(244,114,182,0.06) 0%, transparent 50%),
                  linear-gradient(180deg, #fafbfe 0%, #fdf2f8 100%);
      color: var(--text); line-height: 1.6;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 64px 24px 48px; }
    h1 {
      text-align: center; font-size: clamp(30px, 5vw, 40px);
      font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px;
      background: var(--gradient-primary); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .subtitle {
      text-align: center; color: var(--text-secondary);
      margin-bottom: 40px; font-size: 17px;
    }
    .card {
      background: var(--surface-solid); border: 1px solid var(--border);
      border-radius: 20px; padding: 36px; box-shadow:
        0 20px 50px -12px rgba(236,72,153,0.08), 0 8px 20px -8px rgba(0,0,0,0.04);
      margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--gradient-primary);
    }
    label { display: block; font-weight: 650; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; letter-spacing: -0.01em; }
    textarea, input[type="text"] {
      width: 100%; padding: 13px 16px; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 15px; margin-bottom: 16px;
      min-height: 150px; background: var(--surface-solid); color: var(--text);
      transition: all 0.2s ease; outline: none; resize: vertical;
    }
    textarea:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(236,72,153,0.12);
    }
    .btn {
      background: var(--gradient-primary); color: white; border: none;
      padding: 16px 32px; border-radius: 9999px; font-size: 16px;
      font-weight: 700; cursor: pointer; width: 100%; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 4px 16px rgba(236,72,153,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(236,72,153,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
    .btn:active { transform: translateY(0); }
    .improvements {
      background: linear-gradient(135deg, #fdf2f8, #fce7f3);
      border: 1px solid rgba(236,72,153,0.1); padding: 24px; border-radius: 14px;
      margin-top: 24px; line-height: 1.8;
    }
    .improvement-item { padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
    .improvement-item:last-child { border-bottom: none; }
    .badge {
      display: inline-flex; align-items: center;
      background: rgba(16,185,129,0.1); color: #059669;
      padding: 3px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-right: 8px;
    }
    .badge.warn { background: rgba(245,158,11,0.1); color: #b45309; }
  </style>
<meta name="google-adsense-account" content="ca-pub-8410225250422623">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8410225250422623" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <h1>📝 CoverEnhance</h1>
    <p class="subtitle">Optimize your cover letters with AI-powered suggestions</p>
    
    <div class="card">
      <label>Paste your cover letter</label>
      <textarea id="coverLetter" placeholder="Paste your cover letter here..."></textarea>
      
      <label>Target Job/Industry</label>
      <input type="text" id="targetJob" placeholder="e.g. Software Engineer at Google" style="width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:8px;font-size:16px;margin-bottom:16px;">
      
      <button class="btn" onclick="enhanceLetter()">Optimize Cover Letter</button>
    </div>
    
    <div class="card" id="result" style="display:none;">
      <h3>✨ Optimizations Found</h3>
      <div class="improvements" id="improvements"></div>
    </div>
  </div>

  <script src="src/js/app.js"></script>
</body>
</html>
