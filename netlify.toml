[build]
  publish = "."
  command = ""

# SPA redirect for root (landingcraft hub)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Tool subdirectory redirects - each tool's index.html is its entry point
[[redirects]]
  from = "/covercraft"
  to = "/covercraft/index.html"
  status = 301

[[redirects]]
  from = "/blogcraft"
  to = "/blogcraft/index.html"
